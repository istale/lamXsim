# Study manifest: the human-supplied semantics that give GDS physical meaning.
#
# GDS layer numbers are identifiers, not engineering semantics. Everything in
# this file is a claim about the technology and the measurement campaign that
# someone has to own; the run records it verbatim so a result can be read
# against the assumptions it was produced under.
#
# See docs/first_principles_engineering.md for what each entry commits to.

layout:
  top_cell: null            # null = the layout's single top cell, else name it
  # The bounding box of arbitrary top-cell geometry is not the physical die.
  # Give the outline explicitly when it is known.
  die_outline_um: null      # [xmin, ymin, xmax, ymax]

  # Ordered metal stack, topmost first. Order matters: cross-layer features
  # are signed and named by it, and "top vs underlying" is defined from it.
  metal_layers:
    - {name: M8, layer: 8, datatype: 0}
    - {name: M7, layer: 7, datatype: 0}

  # Via layers, keyed by the metal layer they sit under, so via features
  # carry that layer's identity into the association table.
  via_layers:
    M8: {name: V7, layer: 17, datatype: 0}

  # Dummy fill, per metal layer. Fill is declared rather than inferred:
  # separating it from routing by shape alone is guesswork, and getting it
  # wrong makes a fill edge look like a minimum-width routing line.
  fill_layers: {}

  # The layout revision this file is. Failures carrying a different one are
  # refused: features come from one GDS, so a failure from another revision
  # would be scored against geometry that was not on its silicon.
  layout_revision: null

  # A shape at least this wide counts as wide metal rather than routing.
  # Rabie et al. (2018) list wide-metal slotting among the layout levers.
  wide_width_um: 3.0

  # Package context. Absent layers are recorded as uncontrolled confounding
  # rather than silently ignored -- every layout lever in Rabie et al. (2018)
  # is defined relative to bumps.
  # A layer number is not a semantics. `polarity` says whether the polygon is
  # the object (positive) or a hole in a film (opening); getting it backwards
  # inverts every distance measured from that layer. It defaults to positive
  # for bump/pad/crackstop and opening for pi_opening.
  package_layers:
    bump: {name: BUMP, layer: 60, datatype: 0, polarity: positive}
    pad: null
    pi_opening: {name: PI, layer: 61, datatype: 0, polarity: opening}
    crackstop: {name: CS, layer: 62, datatype: 0, polarity: positive}

  # How a pad is attached to its bump, and an opening to its pad. The rules
  # disagree exactly where the layout is interesting -- an offset pad, a bump
  # hanging over a pad edge, a missing bump, one bump serving two pads -- so
  # this is declared, not guessed. One of:
  #   centroid_containment  the secondary's centre is inside the primary
  #   full_containment      all of the secondary is inside the primary
  #   nearest               nearest centroid, within match_tolerance_um
  #   one_to_one            nearest, and mutually so; non-mutual pairs are
  #                         dropped rather than reported with a note
  # The bare word "containment" is refused: the first two differ exactly on
  # the offset placements a concentricity study is about.
  object_matching: centroid_containment
  # match_tolerance_um: 50.0        # for nearest / one_to_one

  # The shape a recommendation is measured against, because nothing in a
  # layout says which shape a process recommends. Plan-view interior angles:
  # 135 is a regular octagon, 90 a rectangle.
  #
  # There is deliberately no sidewall or taper angle here. A GDS holds no Z
  # information, so no vertical angle is derivable from it by any means; a
  # manifest offering one under a plan-view key is refused rather than
  # silently treated as the plan-view angle.
  shape_targets:
    pad_corner_angle_deg: 135.0
    pi_plan_view_corner_angle_deg: 90.0
    corner_angle_tolerance_deg: 5.0

  # PDK-informed, per metal layer. The line-end definition needs to know what
  # counts as a routing line; without these it falls back to the shortest edge
  # in the design, which on a layout with dummy fill is the fill edge.
  line_rules:
    M8: {min_width_um: 0.20, line_max_width_um: 2.0}
    M7: {min_width_um: 0.10, line_max_width_um: 1.0}

inspection:
  # Where inspection had a real opportunity to find a failure. One of:
  #   gds_layer: {name: INSP, layer: 90, datatype: 0}
  #   rectangles: [[x0, y0, x1, y1], ...]
  #   full_die: "justification for claiming whole-die coverage"
  footprint:
    full_die: null
  min_coverage: 0.5         # a cell inspected less than this takes no part

  # Per-die overrides, keyed by "lot_id|wafer_id|die_x|die_y". A campaign
  # rarely inspects every die the same way; the default above covers the rest.
  footprint_per_die: {}

registration:
  # CSV with layout_x_um, layout_y_um, measured_x_um, measured_y_um.
  # Without it, position_sigma_um must come from the failure file itself and
  # no scale can be certified from measured fiducials.
  fiducials: null
  allow_reflection: true    # backside imaging mirrors the frame

analysis:
  # Committed before looking at failures (spec sections 12-14).
  scales_um: [25, 50, 100, 250, 500, 1000]
  pair_selection: adjacent_and_top
  with_gradients: true
  n_permutations: 999
  # Scales below 3x the positional uncertainty are excluded from primary
  # results rather than reported with a caveat.
  enforce_scale_gate: true

# Package and process conditions. None of these is in the GDS, and the
# literature shows each of them changing the crack driving force -- Li et al.
# (2023, 2025) vary EMC thickness, underfill CTE and the PI opening;
# Zahedmanesh & Vanstreels (2019) make the whole result depend on material
# stiffness. If one varies across the samples in a study and is not handled,
# an apparent geometry effect may be standing in for it.
#
# Declare each as fixed (with its value), stratified, or a baseline covariate.
# Anything left out is reported as an undeclared condition, which is a stated
# limitation rather than an absence of one. The software cannot check these --
# only refuse to let them go unmade.
sample_conditions:
  fixed: {}          # e.g. {emc_thickness_um: 400, package_type: FCCSP}
  stratified: []     # e.g. [thermal_cycle_condition]
  covariate: []      # e.g. [underfill_cte_ppm_k]

